[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qmini-rps"
version = "0.1.0"
description = "Camera rock-paper-scissors demo for the Qmini uHand"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "qmini-avatar>=0.1.0",
  "uhand-control>=0.1.0",
  "opencv-python>=4.10",
  "mediapipe==0.10.21; platform_system == 'Darwin'",
  "mediapipe>=0.10.14,<0.11; platform_system != 'Darwin'",
]

[project.scripts]
qmini-rps = "qmini_rps.app:main"

[tool.uv.sources]
qmini-avatar = { path = "../qmini_avatar", editable = true }
uhand-control = { path = "../../hand_serial_tools", editable = true }
cds-arm-control = { path = "../..", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["qmini_rps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
