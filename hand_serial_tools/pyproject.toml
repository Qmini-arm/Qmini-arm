[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uhand-control"
version = "0.1.0"
description = "Five-finger-only direct USB motion API for the uHand UNO"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5,<4",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[tool.setuptools]
packages = ["uhand"]

[tool.setuptools.package-data]
uhand = ["py.typed"]
