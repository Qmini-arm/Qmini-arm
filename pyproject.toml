[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cds-arm-control"
version = "0.2.0"
description = "Basic safe motion API for a six-axis CDS55xx robot arm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5,<4",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[tool.setuptools]
packages = ["cds_arm"]
py-modules = []

[tool.setuptools.package-data]
cds_arm = ["py.typed"]
